name: header

# Repaints the profile header every hour. The image is a still — nothing in it
# moves — but no two runs publish the same picture: a new random network each
# run, and the reading of it cycles 0 -> 1 -> 2 -> 0 with the run number.
on:
  # bot commits are pushed with GITHUB_TOKEN, which never re-triggers a workflow,
  # so this cannot loop on its own README commit
  push:
    branches: [main]
    paths: ["scripts/**", ".github/workflows/header.yml"]
  # GitHub drops scheduled slots under load — hourly runs are regularly skipped
  # entirely. Three attempts an hour plus the freshness guard below turns "maybe
  # this hour" into "about once an hour".
  schedule:
    - cron: "7,27,47 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: header
  cancel-in-progress: true

jobs:
  paint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Only the first attempt of the hour does any work. A manual run always
      # repaints, so this never gets in the way of trying something.
      - name: skip if painted less than 50 minutes ago
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          skip=false
          if [ "${{ github.event_name }}" = "schedule" ]; then
            ts=$(gh api "repos/${{ github.repository }}/releases/tags/live" \
                   --jq '.assets[] | select(.name=="header.png") | .updated_at' 2>/dev/null || true)
            if [ -n "$ts" ]; then
              age=$(( $(date -u +%s) - $(date -u -d "$ts" +%s) ))
              echo "last painted ${age}s ago"
              [ "$age" -lt 3000 ] && skip=true
            fi
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        if: steps.guard.outputs.skip != 'true'
        with:
          python-version: "3.12"
      - run: pip install --quiet numpy scipy pillow
        if: steps.guard.outputs.skip != 'true'

      - name: paint
        if: steps.guard.outputs.skip != 'true'
        id: paint
        run: |
          echo "caption=$(python3 scripts/still.py ${{ github.run_number }})" >> "$GITHUB_OUTPUT"

      # Release assets are not git objects. Committing a ~150 KB PNG hourly would
      # add roughly 1.3 GB of history a year that can never be reclaimed without
      # rewriting the repo; replacing one release asset keeps it flat.
      - name: publish the image
        if: steps.guard.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view live >/dev/null 2>&1 || \
            gh release create live --title "live header" --notes "repainted hourly by .github/workflows/header.yml"
          gh release upload live assets/header.png --clobber

      # GitHub serves README images through camo, which caches by URL. Same URL
      # with new bytes means visitors keep seeing the old picture, so the query
      # string carries the run number: new URL, cache miss, fresh fetch.
      - name: point the README at it
        if: steps.guard.outputs.skip != 'true'
        env:
          CAPTION: ${{ steps.paint.outputs.caption }}
        run: |
          python3 - <<'PY'
          import os, pathlib, re
          repo, run = os.environ["GITHUB_REPOSITORY"], os.environ["GITHUB_RUN_NUMBER"]
          url = f"https://github.com/{repo}/releases/download/live/header.png?v={run}"
          block = ("<!--HEADER-->\n"
                   '<p align="center">\n'
                   f'  <img src="{url}" width="640" height="320" alt="{os.environ["CAPTION"]}">\n'
                   "</p>\n<!--/HEADER-->")
          p = pathlib.Path("README.md"); md = p.read_text(encoding="utf-8")
          p.write_text(re.sub(r"<!--HEADER-->.*?<!--/HEADER-->", lambda _: block, md, flags=re.S), encoding="utf-8")
          PY

      - name: commit the pointer
        if: steps.guard.outputs.skip != 'true'
        run: |
          git config user.name  "header[bot]"
          git config user.email "header@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet || git commit -m "header: run ${{ github.run_number }}"
          git push
